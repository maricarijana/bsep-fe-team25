<header class="header" *ngIf="isLoggedIn()">
  <div class="header-content">
    <a routerLink="/home" class="logo">BSEP Sistem</a>

    <nav class="nav-links" *ngIf="isAdmin() || isCAUser()">
      <a routerLink="/certificates" class="nav-link">Certificates</a>
      <a routerLink="/admin/ca-users" class="nav-link admin-link" *ngIf="isAdmin()">Admin Panel</a>
    </nav>

    <div class="header-actions">
      <a routerLink="/profile" class="profile-link" title="Profil">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>

      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
