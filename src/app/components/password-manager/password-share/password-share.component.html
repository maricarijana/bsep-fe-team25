<!-- src/app/password-manager/password-share/password-share.component.html -->

<div class="password-share-container">
  <div class="header">
    <h1>Share Password</h1>
    <button class="cancel-btn" (click)="cancel()">Cancel</button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="loading">
    <p>Loading...</p>
  </div>

  <!-- Share Content -->
  <div class="share-content" *ngIf="!loading && passwordItem">
    
    <!-- Password Info -->
    <section class="info-section">
      <h2>📤 Sharing Password</h2>
      <div class="password-info-card">
        <div class="website-icon">🌐</div>
        <div class="password-info">
          <h3>{{ passwordItem.website }}</h3>
          <p>{{ passwordItem.username }}</p>
        </div>
      </div>
    </section>

    <!-- User Selection -->
    <section class="user-selection-section">
      <h2>👥 Select User to Share With</h2>

      <!-- Search Bar -->
      <div class="search-bar">
        <input
          type="text"
          placeholder="Search users by email or name..."
          (input)="onSearchChange($event)"
          class="search-input"
        />
      </div>

      <!-- Available Users -->
      <div class="users-list" *ngIf="filteredUsers.length > 0">
        <button
          *ngFor="let user of filteredUsers"
          type="button"
          class="user-btn"
          [class.active]="shareForm.get('sharedWithUserId')?.value === user.id"
          (click)="selectUser(user.id, user.email)"
        >
          <div class="user-avatar">👤</div>
          <div class="user-info">
            <strong>{{ user.name }} {{ user.surname }}</strong>
        <span class="user-email">{{ user.email }}</span>
        <span class="user-org" *ngIf="user.organization">{{ user.organization }}</span>
          </div>
          <div class="user-checkmark" *ngIf="shareForm.get('sharedWithUserId')?.value === user.id">
            ✓
          </div>
        </button>
      </div>

      <!-- No Users Found -->
      <div class="empty-state" *ngIf="filteredUsers.length === 0 && !loading">
        <p>No users found</p>
      </div>
    </section>

    <!-- Private Key Upload -->
    <section class="private-key-section">
      <h2>🔑 Your Private Key</h2>
      <p class="hint">
        To share this password, you need to decrypt it first with your private key, 
        then re-encrypt it for the recipient.
      </p>
      
      <app-private-key-upload
        (keyLoaded)="onPrivateKeyLoaded($event)"
        (keyCleared)="onPrivateKeyCleared()">
      </app-private-key-upload>
    </section>

    <!-- Share Button -->
    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="cancel()">
        Cancel
      </button>
      <button
        type="button"
        class="share-btn"
        [disabled]="!shareForm.valid || !privateKeyData || sharing"
        (click)="sharePassword()"
      >
        <span *ngIf="!sharing">📤 Share Password</span>
        <span *ngIf="sharing">Sharing...</span>
      </button>
    </div>
  </div>
</div>
